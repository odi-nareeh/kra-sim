spring.application.name=kra-sim
server.port=${PORT:8080}

# Database. Locally these defaults work; on a host, set the SPRING_DATASOURCE_* variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/kra_sim_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway builds and upgrades the schema. Hibernate only checks that entities match it.
spring.flyway.enabled=true
# An existing database (from Steps 2-4) is treated as version 1 instead of being rebuilt
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Set SPRING_THYMELEAF_CACHE=true in production
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

# Behind the host's HTTPS proxy
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Staff accounts seeded on first startup (set the environment variables in production)
kra.officer.username=${OFFICER_USERNAME:officer}
kra.officer.password=${OFFICER_PASSWORD:ChangeMe-2026}
kra.auditor.username=${AUDITOR_USERNAME:auditor}
kra.auditor.password=${AUDITOR_PASSWORD:ChangeMe-Audit-2026}

# Login throttling: a username is blocked after 5 failures, an IP after 20, for 15 minutes
kra.security.max-user-failures=5
kra.security.max-ip-failures=20
kra.security.lockout-minutes=15