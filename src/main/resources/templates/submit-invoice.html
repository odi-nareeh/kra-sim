<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('eTIMS POS Simulator')}"></head>
<body class="page-invoice">

<header th:replace="~{fragments :: header(${activePage})}"></header>

<main class="container narrow" id="main-content">
    <h1>eTIMS POS Simulator</h1>
    <p class="subtitle">
        Simulates a point-of-sale device pushing a sale to
        <code>POST /api/v1/invoices/submit</code>.
    </p>

    <form class="card form" id="invoiceForm">
        <label for="apiKey">Device API key</label>
        <input type="password" id="apiKey" autocomplete="off" required
               placeholder="Key issued to this POS device">
        <small class="hint">Sent as the <code>X-API-Key</code> header. Create a key on the <a th:href="@{/devices}">Devices</a> page.</small>

        <label for="taxpayerPin">Taxpayer PIN</label>
        <input type="text" id="taxpayerPin" placeholder="A112233445Z" maxlength="11" required>

        <label for="amountBeforeTax">Sale Amount before Tax (KSh)</label>
        <input type="number" id="amountBeforeTax" placeholder="10000" min="1" step="0.01" required>

        <!-- Live preview of the 16% VAT rule -->
        <div class="preview">
            <div><span>VAT (16%)</span><strong>KSh <span id="previewVat">0.00</span></strong></div>
            <div><span>Total</span><strong>KSh <span id="previewTotal">0.00</span></strong></div>
        </div>

        <button type="submit" class="btn btn-primary">Send Invoice to KRA</button>
    </form>

    <!-- Server response appears here -->
    <div id="result" class="alert hidden" role="status" aria-live="polite"></div>
    <pre id="responseJson" class="json-box hidden" aria-label="Server response"></pre>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/invoice.js}"></script>
</body>
</html>
